
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Three Stars, One Infinity ✨</title>

<style>
* {
  margin: 0;
  padding: 0;
  box-sizing: border-box;
}

body {
  min-height: 100vh;
  overflow: hidden;
  font-family: Georgia, serif;
  color: white;
  background:
    radial-gradient(ellipse at bottom, #24134a 0%, #100a29 45%, #030513 100%);
  display: flex;
  justify-content: center;
  align-items: center;
}

#universe {
  position: fixed;
  inset: 0;
  overflow: hidden;
  pointer-events: none;
}

.twinkle {
  position: absolute;
  color: white;
  animation: twinkle 2s infinite alternate;
}

@keyframes twinkle {
  from { opacity: .2; transform: scale(.7); }
  to { opacity: 1; transform: scale(1.2); }
}

.container {
  width: 100%;
  max-width: 500px;
  padding: 25px 20px;
  text-align: center;
  position: relative;
  z-index: 2;
}

.eyebrow {
  color: #d9c7ff;
  letter-spacing: 4px;
  font-size: 11px;
  text-transform: uppercase;
  margin-bottom: 17px;
}

h1 {
  font-size: clamp(30px, 8vw, 43px);
  font-weight: normal;
  line-height: 1.2;
  text-shadow: 0 0 25px #b89aff;
}

.subtitle {
  color: #d6cbea;
  font-size: 15px;
  line-height: 1.7;
  margin: 17px auto 28px;
}

.stars {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: clamp(15px, 5vw, 29px);
  margin: 35px 0 25px;
}

.star-card {
  border: 1px solid #ffffff20;
  background: #ffffff09;
  border-radius: 50px;
  width: 100px;
  min-height: 135px;
  padding: 15px 5px;
  color: white;
  cursor: pointer;
  transition: transform .3s, background .3s;
  -webkit-tap-highlight-color: transparent;
}

.star-card:hover,
.star-card:focus-visible {
  transform: translateY(-8px) scale(1.05);
  background: #ffffff18;
  outline: none;
}

.star {
  display: block;
  font-size: 48px;
  color: #fff2a6;
  filter: drop-shadow(0 0 12px #ffe68b);
  animation: float 3s ease-in-out infinite;
}

.star-card:nth-child(2) .star {
  animation-delay: .6s;
}

.star-card:nth-child(3) .star {
  animation-delay: 1.2s;
  color: #f0d7ff;
  filter: drop-shadow(0 0 14px #c6a0ff);
}

@keyframes float {
  0%, 100% { transform: translateY(0); }
  50% { transform: translateY(-9px); }
}

.star-label {
  display: block;
  margin-top: 12px;
  font-size: 11px;
  color: #e6dafa;
  letter-spacing: 1px;
}

.hint {
  color: #b7a8d4;
  font-size: 12px;
  letter-spacing: 1px;
  animation: twinkle 2.5s infinite alternate;
}

.signature {
  margin-top: 32px;
  font-size: 13px;
  color: #a99bc9;
}

/* Letter popup */

.overlay {
  position: fixed;
  inset: 0;
  z-index: 10;
  display: none;
  justify-content: center;
  align-items: center;
  padding: 20px;
  background: #03030bdc;
  backdrop-filter: blur(9px);
}

.overlay.show {
  display: flex;
  animation: appear .35s ease;
}

@keyframes appear {
  from { opacity: 0; }
  to { opacity: 1; }
}

.letter {
  width: 100%;
  max-width: 410px;
  max-height: 85vh;
  overflow-y: auto;
  padding: 32px 24px;
  text-align: center;
  border: 1px solid #c5a9ff70;
  border-radius: 22px;
  background: linear-gradient(145deg, #21143b, #0d1028);
  box-shadow: 0 0 50px #9870ff30;
}

.letter-icon {
  font-size: 37px;
  margin-bottom: 14px;
}

.letter h2 {
  font-size: 27px;
  font-weight: normal;
  color: #f1dcff;
  margin-bottom: 21px;
}

.letter p {
  font-size: 15px;
  line-height: 1.9;
  color: #eee5ff;
  margin-bottom: 15px;
  white-space: pre-line;
}

.close-btn {
  margin-top: 12px;
  border: 1px solid #c6a6ff80;
  background: #ffffff10;
  color: white;
  border-radius: 30px;
  padding: 12px 25px;
  font-family: inherit;
  font-size: 14px;
  cursor: pointer;
}

.close-btn:active {
  transform: scale(.96);
}

.infinity {
  font-size: 60px;
  color: #e6ccff;
  text-shadow: 0 0 25px #c49aff;
  margin-bottom: 15px;
}

.final-message {
  font-size: clamp(28px, 7vw, 38px) !important;
  line-height: 1.5 !important;
  color: #fff1c4 !important;
  text-shadow: 0 0 20px #c29aff;
}

.heart {
  position: fixed;
  pointer-events: none;
  z-index: 20;
  animation: rise 2.5s ease-out forwards;
}

@keyframes rise {
  from { opacity: 1; transform: translateY(0) scale(.7); }
  to { opacity: 0; transform: translateY(-180px) scale(1.5); }
}

@media (max-width: 360px) {
  .star-card {
    width: 85px;
    min-height: 120px;
  }

  .star {
    font-size: 40px;
  }

  .stars {
    gap: 10px;
  }
}
</style>
</head>

<body>

<div id="universe"></div>

<main class="container">
  <div class="eyebrow">A little universe, just for you</div>

  <h1>Three Stars,<br>One Infinity ✨</h1>

  <p class="subtitle">
    Somewhere among all the stars in the universe,<br>
    there are three little stars waiting just for you, babi.
    <br><br>
    Tap each one to discover what it holds. 💜
  </p>

  <div class="stars">
    <button class="star-card" onclick="openLetter(0)"
      aria-label="Open the first love letter">
      <span class="star">✦</span>
      <span class="star-label">FIRST STAR</span>
    </button>

    <button class="star-card" onclick="openLetter(1)"
      aria-label="Open the second love letter">
      <span class="star">✧</span>
      <span class="star-label">SECOND STAR</span>
    </button>

    <button class="star-card" onclick="openLetter(2)"
      aria-label="Reveal the final message">
      <span class="star">★</span>
      <span class="star-label">INFINITY</span>
    </button>
  </div>

  <p class="hint">✧ THREE STARS. THREE LITTLE SURPRISES. ✧</p>

  <div class="signature">Made with love, just for you ♡</div>
</main>

<div class="overlay" id="overlay" onclick="closeOutside(event)">
  <section class="letter" role="dialog"
    aria-modal="true" aria-labelledby="letterTitle">

    <div class="letter-icon" id="letterIcon">💌</div>
    <h2 id="letterTitle">For My Babi</h2>
    <div id="letterContent"></div>

    <button class="close-btn" onclick="closeLetter()">
      Back to the stars ✨
    </button>
  </section>
</div>

<script>
// ✨ Customize your three surprises here!

const surprises = [
  {
    icon: "💌",
    title: "To My Favorite Person",
    paragraphs: [
      "Hi, babi. ♡",
      "If I could give you one thing in this universe, I'd give you the ability to see yourself through my eyes. Maybe then you'd understand just how special you are to me.",
      "You have this way of making ordinary moments feel like something worth remembering. Even a simple conversation with you can become one of my favorite parts of the day.",
      "Among all the people I could have met, I'm grateful that I got to meet you. And if I could choose again, I'd still be happy to find my way to you."
    ],
    ending: "With all my heart, your babyyy Kiyumiii ♡"
  },
  {
    icon: "🌙",
    title: "A Promise Under the Stars",
    paragraphs: [
      "My dearest Ysha, ♡",
      "I know that sometimes life asks us to be patient, even when all we want is to spend more time together. But I want you to know that you never have to prove your worth to me.",
      "I want to be someone who supports your dreams, respects your worries, and brings a little more happiness into your days. Not just through sweet words, but through the way I treat you.",
      "No matter how slowly the stars move across the sky, I hope we keep growing into better versions of ourselves. And when we look back someday, I hope we'll smile at how far we've come."
    ],
    ending: "One day at a time, one memory at a time. Always cheering for you. ♡"
  },
  {
    icon: "💫",
    title: "My Final Little Secret",
    final: true,
    paragraphs: [
      "I love you for infinity and Beyond"
    ]
  }
];

const universe = document.getElementById("universe");
const overlay = document.getElementById("overlay");
const content = document.getElementById("letterContent");

const starSymbols = ["✦", "·", "✧", "⋆", "·", "✦", "·"];

for (let i = 0; i < 65; i++) {
  const star = document.createElement("span");
  star.className = "twinkle";
  star.textContent = starSymbols[
    Math.floor(Math.random() * starSymbols.length)
  ];
  star.style.left = Math.random() * 100 + "%";
  star.style.top = Math.random() * 100 + "%";
  star.style.fontSize = (Math.random() * 12 + 5) + "px";
  star.style.animationDelay = Math.random() * 3 + "s";
  star.style.animationDuration = (Math.random() * 2 + 1.5) + "s";
  universe.appendChild(star);
}

function openLetter(index) {
  const surprise = surprises[index];

  document.getElementById("letterIcon").textContent = surprise.icon;

  const title = document.getElementById("letterTitle");
  title.textContent = surprise.title;
  title.className = surprise.final ? "final-title" : "";

  content.innerHTML = "";

  if (surprise.final) {
    const infinity = document.createElement("div");
    infinity.className = "infinity";
    infinity.textContent = "∞";
    content.appendChild(infinity);

    const message = document.createElement("p");
    message.className = "final-message";
    message.textContent = surprise.paragraphs[0];
    content.appendChild(message);

    createHearts();
  } else {
    surprise.paragraphs.forEach(text => {
      const paragraph = document.createElement("p");
      paragraph.textContent = text;
      content.appendChild(paragraph);
    });

    const ending = document.createElement("p");
    ending.style.color = "#e1c7ff";
    ending.style.fontStyle = "italic";
    ending.textContent = surprise.ending;
    content.appendChild(ending);
  }

  overlay.classList.add("show");
}

function closeLetter() {
  overlay.classList.remove("show");
}

function closeOutside(event) {
  if (event.target === overlay) closeLetter();
}

document.addEventListener("keydown", event => {
  if (event.key === "Escape") closeLetter();
});

function createHearts() {
  const symbols = ["♡", "♥", "✨", "💜"];

  for (let i = 0; i < 18; i++) {
    const heart = document.createElement("span");
    heart.className = "heart";
    heart.textContent = symbols[
      Math.floor(Math.random() * symbols.length)
    ];
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.top = (55 + Math.random() * 35) + "vh";
    heart.style.fontSize = (15 + Math.random() * 20) + "px";
    heart.style.animationDelay = Math.random() * 1.2 + "s";

    document.body.appendChild(heart);
    setTimeout(() => heart.remove(), 4000);
  }
}
</script>

</body>
</html>
